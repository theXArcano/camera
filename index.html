<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lentes" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>Lentes</title>
    <meta
      name="description"
      content="Câmera do iPhone não funciona, tela preta ou desliga por superaquecimento? App grátis que abre cada lente separadamente, tira foto, grava vídeo e funciona offline."
    />
    <meta property="og:title" content="Lentes: câmera para iPhone com câmera com defeito" />
    <meta
      property="og:description"
      content="Use a lente do iPhone que ainda funciona. Religa sozinho após superaquecimento, foto, vídeo e modo offline."
    />
    <meta property="og:image" content="icons/icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="st"><span class="dot" id="dot"></span><span id="status">Parada</span></div>
        <button class="btn" id="diagBtn">Diagnóstico</button>
      </header>

      <div class="view">
        <video id="v" playsinline muted autoplay></video>
        <div class="res" id="res" hidden></div>
        <div class="timer" id="timer" hidden>00:00</div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <input
          type="range"
          class="zoomw"
          id="zoom"
          min="1"
          max="1"
          step="0.1"
          value="1"
          hidden
          aria-label="Zoom"
        />
        <div class="flash" id="flash"></div>
        <div class="msg" id="msg">
          <b>Câmera por lente</b>
          <p>
            Abre cada câmera traseira separadamente, religa sozinha quando o iPhone corta a imagem, tira foto
            e grava vídeo.
          </p>
          <button class="btn big" id="startBtn">Abrir câmera</button>
        </div>
      </div>

      <div class="bar">
        <div class="chips" id="chips"></div>
        <div class="chips" id="zp" hidden></div>
        <div class="modes">
          <button id="mFoto" class="on">FOTO</button>
          <button id="mVideo">VÍDEO</button>
        </div>
        <div class="row">
          <button class="thumb" id="thumb" aria-label="Galeria">
            <span class="badge" id="badge" hidden>0</span>
          </button>
          <button class="shot" id="shot" disabled aria-label="Tirar foto"><span></span></button>
          <div class="sel">
            <select id="q" aria-label="Qualidade">
              <option value="max">Máxima</option>
              <option value="hd">Média (1080p)</option>
              <option value="low">Leve (720p)</option>
            </select>
            <label class="tg"><input type="checkbox" id="auto" checked /> Religar sozinha</label>
          </div>
        </div>
      </div>
    </div>

    <div class="sheet" id="gallery" hidden>
      <div class="ghead">
        <button class="btn" id="gClose">Fechar</button>
        <h2 id="gTitle">Galeria</h2>
        <button class="btn" id="gSelect">Selecionar</button>
      </div>
      <div class="grid" id="grid"></div>
      <div id="normalBar" class="gfoot">
        <label class="tg" style="justify-content: center">
          <input type="checkbox" id="askSave" /> Abrir "Salvar no Fotos" logo após cada captura
        </label>
        <div class="acts">
          <button class="btn big" id="saveAll">Salvar pendentes no Fotos</button>
          <button class="btn danger" id="clearSaved">Apagar as já salvas</button>
        </div>
        <p>Toque e segure numa foto para selecionar. Depois arraste o dedo para marcar várias de uma vez.</p>
      </div>
      <div id="selBar" class="selbar" hidden>
        <button class="btn" id="sSave">Salvar</button>
        <span id="sCount">Selecione itens</span>
        <button class="btn danger" id="sDel">Apagar</button>
      </div>
    </div>

    <div class="sheet" id="viewer" hidden>
      <img id="big" alt="Foto" hidden />
      <video id="bigv" controls playsinline hidden></video>
      <div class="acts">
        <button class="btn big" id="vSave">Salvar no Fotos</button>
        <button class="btn danger" id="vDel">Apagar</button>
        <button class="btn" id="vClose">Voltar</button>
      </div>
    </div>

    <div class="confirm" id="confirm" hidden>
      <div class="cbox" role="dialog" aria-modal="true" aria-labelledby="cText">
        <div class="cgroup">
          <p id="cText"></p>
          <button id="cYes"></button>
        </div>
        <button id="cNo">Cancelar</button>
      </div>
    </div>

    <div class="sheet" id="diagSheet" hidden>
      <div class="diag" id="diag"></div>
      <div class="acts">
        <button class="btn" id="copyDiag">Copiar</button>
        <button class="btn" id="closeDiag">Fechar</button>
      </div>
    </div>
  </body>
</html>
